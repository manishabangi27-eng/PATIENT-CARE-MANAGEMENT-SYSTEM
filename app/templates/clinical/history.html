{% extends "base.html" %}{% block content %}<h2>Patient Medical History</h2><form class="row g-2 mb-4"><div class="col-md-8"><input name="q" value="{{q}}" class="form-control" placeholder="Search Patient ID or Name" required></div><div class="col-md-2"><button class="btn btn-primary w-100">Search</button></div></form><table class="table table-striped"><tr><th>ID</th><th>Name</th><th>Action</th></tr>{% for p in patients %}<tr><td>{{p.id}}</td><td>{{p.full_name}}</td><td><a class="btn btn-sm btn-primary" href="{{url_for('clinical.history_detail',patient_id=p.id)}}">View Complete History</a></td></tr>{% else %}<tr><td colspan="3">No patients found.</td></tr>{% endfor %}</table>{% endblock %}
