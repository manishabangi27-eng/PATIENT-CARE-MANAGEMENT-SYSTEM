{% extends "base.html" %}{% block content %}<h2>Digital Prescription</h2><form method="POST" class="card p-4">
<label>Patient</label><select name="patient_id" class="form-select mb-3" required>{% for p in patients %}<option value="{{p.id}}">{{p.id}} - {{p.full_name}}</option>{% endfor %}</select>
<label>Medicine Name</label><input name="medicine_name" class="form-control mb-3" required><label>Dosage</label><input name="dosage" class="form-control mb-3" placeholder="e.g. 500 mg"><label>Frequency</label><input name="frequency" class="form-control mb-3" placeholder="e.g. Twice a Day"><label>Duration</label><input name="duration" class="form-control mb-3" placeholder="e.g. 5 Days"><label>Special Instructions</label><textarea name="special_instructions" class="form-control mb-3"></textarea><button class="btn btn-success">Save Prescription</button></form>{% endblock %}
