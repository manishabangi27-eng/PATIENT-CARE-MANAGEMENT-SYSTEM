{% extends "base.html" %}{% block content %}<h2>Reports & Patient Search</h2><p>Search by Patient ID or Patient Name and generate a medical report.</p><form class="row g-2 mb-4"><div class="col-md-8"><input name="q" value="{{q}}" class="form-control" placeholder="Patient ID or Name" required></div><div class="col-md-2"><button class="btn btn-primary w-100">Search</button></div></form><table class="table table-striped"><tr><th>ID</th><th>Patient</th><th>Action</th></tr>{% for p in patients %}<tr><td>{{p.id}}</td><td>{{p.full_name}}</td><td><a class="btn btn-sm btn-primary" href="{{url_for('clinical.patient_report',patient_id=p.id)}}">Generate Report</a></td></tr>{% else %}<tr><td colspan="3">No patients found.</td></tr>{% endfor %}</table>{% endblock %}
