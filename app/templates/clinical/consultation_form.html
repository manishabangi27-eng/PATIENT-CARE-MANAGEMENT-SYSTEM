{% extends "base.html" %}{% block content %}<h2>Patient Consultation Form</h2><form method="POST" class="card p-4">
<label>Patient</label><select name="patient_id" class="form-select mb-3" required>{% for p in patients %}<option value="{{p.id}}">{{p.id}} - {{p.full_name}}</option>{% endfor %}</select>
<label>Symptoms</label><textarea name="symptoms" class="form-control mb-3" rows="4"></textarea><label>Diagnosis</label><textarea name="diagnosis" class="form-control mb-3" rows="4"></textarea><label>Treatment / Notes</label><textarea name="treatment" class="form-control mb-3" rows="4"></textarea><button class="btn btn-success">Save Consultation</button></form>{% endblock %}
