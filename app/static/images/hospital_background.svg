<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#bfe8ff"/><stop offset="1" stop-color="#eaf7ff"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dff7ff"/><stop offset="1" stop-color="#91d8f5"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
<circle cx="1350" cy="130" r="75" fill="#fff4bd" opacity=".7" filter="url(#blur)"/>
<path d="M0 700 Q400 620 800 690 T1600 650 V900 H0Z" fill="#9bd49d" opacity=".8"/>
<rect y="745" width="1600" height="155" fill="#7fbd82"/>
<!-- hospital -->
<rect x="310" y="250" width="980" height="500" rx="12" fill="#f8fbfd"/>
<rect x="365" y="310" width="870" height="440" fill="#e9f3f8"/>
<rect x="650" y="220" width="300" height="530" fill="#f7fbfd"/>
<rect x="700" y="150" width="200" height="115" rx="8" fill="#fff"/>
<!-- roof -->
<path d="M290 250 L800 95 L1310 250Z" fill="#397da8"/>
<path d="M625 205 L800 125 L975 205Z" fill="#2f668a"/>
<!-- windows -->
<g fill="url(#glass)" stroke="#6ca8c5" stroke-width="5">
<rect x="410" y="350" width="145" height="110"/><rect x="585" y="350" width="145" height="110"/>
<rect x="870" y="350" width="145" height="110"/><rect x="1045" y="350" width="145" height="110"/>
<rect x="410" y="500" width="145" height="110"/><rect x="585" y="500" width="145" height="110"/>
<rect x="870" y="500" width="145" height="110"/><rect x="1045" y="500" width="145" height="110"/>
</g>
<!-- entrance -->
<rect x="720" y="430" width="160" height="320" rx="5" fill="#8ac9e7"/>
<rect x="740" y="450" width="120" height="300" fill="#d8f2fc"/>
<!-- medical cross -->
<rect x="770" y="170" width="60" height="150" rx="8" fill="#e63946"/>
<rect x="725" y="215" width="150" height="60" rx="8" fill="#e63946"/>
<!-- sign -->
<rect x="625" y="330" width="350" height="70" rx="12" fill="#fff" stroke="#397da8" stroke-width="5"/>
<text x="800" y="377" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#245b7a">ICMP HOSPITAL</text>
<!-- foreground -->
<path d="M0 800 Q400 750 800 810 T1600 790 V900 H0Z" fill="#66a96c"/>
</svg>